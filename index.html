<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ReverseUntis</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 350px; font-size: 16px; padding: 10px; box-sizing: border-box; }
    #status { font-size: 13px; color: gray; margin-top: 5px; }
  </style>
</head>
<body>
  <textarea id="textfeld" placeholder="Hier tippen – alle PCs sehen denselben Text..."></textarea>
  <div id="status">Verbinde...</div>

  <script>
    const URL = "https://reverseuntis-default-rtdb.europe-west1.firebasedatabase.app/textfeld.json";
    const textfeld = document.getElementById("textfeld");
    const status = document.getElementById("status");
    let tipptGerade = false;
    let timer;

    // 1. Beim Tippen automatisch für alle speichern (mit PUT überschreiben)
    textfeld.addEventListener("input", () => {
      tipptGerade = true;
      status.innerText = "Speichert...";
      clearTimeout(timer);

      timer = setTimeout(async () => {
        await fetch(URL, {
          method: "PUT",
          body: JSON.stringify({ inhalt: textfeld.value })
        });
        status.innerText = "Gespeichert ✅";
        tipptGerade = false;
      }, 300);
    });

    // 2. Jede Sekunde prüfen, ob ein anderer PC etwas geändert hat
    async function laden() {
      if (tipptGerade) return; // Blockiert Überschreiben, solange du selbst tippst

      const res = await fetch(URL);
      const data = await res.json();

      if (data && data.inhalt !== undefined && textfeld.value !== data.inhalt) {
        textfeld.value = data.inhalt;
      }
      status.innerText = "Live synchronisiert ✅";
    }

    laden();
    setInterval(laden, 1000);
  </script>
</body>
</html>
