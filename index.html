<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ReverseUntis – Lehrer-Klassenbuch</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { margin: 0; background: #f4f5f7; color: #222; }
    header { background: #ff6600; color: white; padding: 15px 25px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1050px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    button { background: #ff6600; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #e05a00; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .badge-pos { background: #d4edda; color: #155724; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    .badge-neg { background: #f8d7da; color: #721c24; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    .badge-late { background: #fff3cd; color: #856404; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    .del-btn { background: none; color: red; width: auto; padding: 2px 6px; margin: 0; }
    .del-btn:hover { background: #fee; }
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 750px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <span>ReverseUntis</span>
    <span style="font-size: 13px; font-weight: normal;">Live Lehrer-Klassenbuch</span>
  </header>

  <div class="container">
    <!-- 1. NEUER EINTRAG -->
    <div class="card">
      <h2>Neuer Eintrag</h2>
      <input id="lehrer" list="lehrer-liste" type="text" placeholder="Lehrer (z. B. Herr Müller)">
      <datalist id="lehrer-liste"></datalist>

      <select id="typ">
        <option value="neg">👎 Negativ-Eintrag</option>
        <option value="pos">👍 Positiv-Eintrag</option>
        <option value="none">➖ Neutral (Nur Verspätung)</option>
      </select>

      <input id="verspaetung" type="number" min="0" placeholder="Verspätung in Minuten (optional, z. B. 10)">
      <input id="grund" type="text" placeholder="Grund / Notiz (optional bei Verspätung)">

      <button onclick="eintragen()">Ins Klassenbuch eintragen</button>
    </div>

    <!-- 2. LEADERBOARD -->
    <div class="card">
      <h2>🏆 Lehrer-Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th>Platz</th>
