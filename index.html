<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebUntis EIMLB – Lehrer-Einschreibung (Sekundarstufe)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center font-bold text-lg">
          U
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-base">WebUntis</span>
            <span class="text-xs bg-orange-500/20 text-orange-300 border border-orange-400/30 px-2 py-0.5 rounded font-semibold">
              EIMLB Lehrer-Einschreibung
            </span>
          </div>
          <p id="adminStatusText" class="text-[11px] text-slate-400">Modus: Normaler Benutzer (Ansicht)</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="markAllPresent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-check-double"></i> Alle anwesend
        </button>

        <div id="authButtonContainer">
          <button onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-700 text-orange-400 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-lock"></i> Admin Login
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-5xl w-full mx-auto p-4 flex-1 space-y-4">

    <!-- ADMIN BEREICH -->
    <div id="adminPanel" class="hidden bg-orange-50 border border-orange-200 p-4 rounded-xl shadow-xs space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold uppercase tracking-wider text-orange-800 flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved"></i> Admin-Bedienfeld (Aktiviert)
        </h3>
        <button onclick="logoutAdmin()" class="text-xs font-semibold text-rose-600 hover:underline">Admin abmelden</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- Lehrer hinzufügen -->
        <div class="bg-white p-3 rounded-lg border border-orange-200 flex flex-col gap-2">
          <span class="text-xs font-bold text-slate-700">Neuen Lehrer hinzufügen</span>
          <div class="flex flex-col sm:flex-row gap-2">
            <input id="newTeacherName" type="text" placeholder="Vorname Nachname" class="flex-1 text-xs px-2.5 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500" />
            <input id="newTeacherRole" type="text" placeholder="Fachbereich" class="w-full sm:w-36 text-xs px-2.5 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500" />
            <button onclick="addTeacherByAdmin()" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-2 rounded-lg text-xs font-semibold shrink-0">
              + Hinzufügen
            </button>
          </div>
        </div>

        <!-- System zurücksetzen -->
        <div class="bg-white p-3 rounded-lg border border-orange-200 flex items-center justify-between gap-2">
          <div>
            <span class="text-xs font-bold text-slate-700 block">Gesamte Daten zurücksetzen</span>
            <span class="text-[11px] text-slate-500">Setzt alle Anwesenheiten & Einträge zurück.</span>
          </div>
          <button onclick="resetAllData()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-semibold shrink-0">
            Zurücksetzen
          </button>
        </div>
      </div>
    </div>

    <!-- STATISTIK -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
        <div class="text-[11px] text-slate-500 font-medium">Anwesend</div>
        <div id="statPresent" class="text-xl font-bold text-emerald-600">0</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
        <div class="text-[11px] text-slate-500 font-medium">Verspätet</div>
        <div id="statLate" class="text-xl font-bold text-amber-500">0</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
        <div class="text-[11px] text-slate-500 font-medium">Abwesend</div>
        <div id="statAbsent" class="text-xl font-bold text-rose-600">0</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
        <div class="text-[11px] text-slate-500 font-medium">+ Positiv</div>
        <div id="statPos" class="text-xl font-bold text-emerald-600">+0</div>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs col-span-2 sm:col-span-1">
        <div class="text-[11px] text-slate-500 font-medium">- Negativ</div>
        <div id="statNeg" class="text-xl font-bold text-rose-600">-0</div>
      </div>
    </div>

    <!-- SUCHE & FILTER -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 flex-wrap">
        <button onclick="setFilter('ALL')" id="filter-ALL" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white">Alle (<span id="countAll">0</span>)</button>
        <button onclick="setFilter('LATE')" id="filter-LATE" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-amber-50">Verspätet</button>
        <button onclick="setFilter('ABSENT')" id="filter-ABSENT" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-rose-50">Abwesend</button>
        <button onclick="setFilter('ENTRIES')" id="filter-ENTRIES" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-orange-50">Mit +/- Eintrag</button>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <input id="searchInput" oninput="renderTeachers()" type="text" placeholder="Lehrer oder Fach suchen..." class="text-xs px-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500 w-full sm:w-52" />
      </div>
    </div>

    <!-- LEHRER-LISTE -->
    <div id="teacherList" class="space-y-2.5"></div>
  </main>

  <!-- MODAL: ADMIN LOGIN -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="text-sm font-bold text-slate-900"><i class="fa-solid fa-lock text-orange-500 mr-1.5"></i> Admin Login</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-700 text-lg px-2"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Passwort eingeben</label>
        <input id="adminPasswordInput" type="password" placeholder="Passwort..." class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-orange-500" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeLoginModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Abbrechen</button>
        <button onclick="verifyAdminLogin()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 text-xs font-semibold rounded-lg shadow-sm">Anmelden</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "eimlb_admin_teachers_v2";
    const ADMIN_PASS = "Gaylord!";

    const badWords = [
      "arsch", "scheiss", "schlampe", "idiot", "vollidiot", "huren", "wichser", "fotze",
      "merde", "connard", "putain", "salopard", "connasse", "enculé",
      "bitch", "fuck", "shit", "asshole", "bastard", "cunt", "dick"
    ];

    let isAdminLoggedIn = localStorage.getItem("eimlb_is_admin") === "true";

    const defaultTeachers = [
      { name: "Angela Do Carmo", role: "English" },
      { name: "Andrea Fiorucci", role: "French" },
      { name: "Carine Ambrosini", role: "French" },
      { name: "Carolin Muhlmann", role: "German" },
      { name: "Claire Plichta", role: "English & French" },
      { name: "Claude Kiefer", role: "Integrated Sciences" },
      { name: "Dana Wies", role: "German" },
      { name: "David Pollastro", role: "Integrated Sciences" },
      { name: "David Calmeille", role: "TINCO" },
      { name: "Delphine Mariotte", role: "English" },
      { name: "Djillali Maamri", role: "Economy" },
      { name: "Désirée Schmitt-Rock", role: "Humanities & English" },
      { name: "Elodie Medernach", role: "French" },
      { name: "Emilie Landais", role: "Art education" },
      { name: "Emmanuelle Koch", role: "Life and Society" },
      { name: "Gisela Azevedo", role: "Portuguese" },
      { name: "Janna Meyer - Boye", role: "German" },
      { name: "Kasia Stefanowicz", role: "English" },
      { name: "Laura Ludovicy", role: "Humanities & Luxembourgish" },
      { name: "Marc Duplantier", role: "Integrated Sciences" },
      { name: "Marc Paul", role: "Mathematics" },
      { name: "Maria Schür", role: "Life and Society" },
      { name: "Markus Mertz", role: "Integrated Sciences & Mathematics" },
      { name: "Max Reuter", role: "Physical Education" },
      { name: "Melvin Victorio", role: "Integrated Sciences" },
      { name: "Milica Spica", role: "Luxembourger" },
      { name: "Mylène Passetti", role: "French" },
      { name: "Nadia Carnazzo", role: "Italian" },
      { name: "Nathalie Tremont", role: "German" },
      { name: "Nicole Sigaray", role: "Music Education" },
      { name: "Pascal Engel", role: "Mathematics" },
      { name: "Paul-Matthieu Scherrer", role: "Physical Education" },
      { name: "Robert Harris", role: "Mathematics" },
      { name: "Romain Bourson", role: "Humanities" },
      { name: "Sally Kremer", role: "Humanities & Luxembourgish" },
      { name: "Sophie Dean", role: "English" },
      { name: "Sylvester Bubel", role: "German" },
      { name: "Tom Decker", role: "Humanities" },
      { name: "Valérie Bosseler", role: "Art education" },
      { name: "Vanessa Kurtz", role: "Integrated Sciences" }
    ];

    const positiveReasons = [
      "Pünktlich & bestens vorbereitet",
      "Sehr strukturierter Unterricht",
      "Tolle Mitarbeit im Team",
      "Hilfsbereit bei Vertretung",
      "Hervorragendes Feedback erhalten"
    ];

    const negativeReasons = [
      "Zu spät zum Unterricht erschienen",
      "Unterrichtsmaterial nicht bereit",
      "Unentschuldigt abwesend",
      "Zu spät zur Aufsicht erschienen",
      "Absprache nicht eingehalten"
    ];

    let teachers = [];
    let currentFilter = "ALL";
    let openPanel = {};

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        teachers = JSON.parse(saved);
      } else {
        teachers = defaultTeachers.map((t, idx) => {
          const parts = t.name.split(" ");
          const short = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1].slice(0, 2)).toUpperCase() : t.name.slice(0, 3).toUpperCase();
          return {
            id: "t-" + idx,
            short,
            name: t.name,
            role: t.role,
            status: "PRESENT",
            lateMinutes: 0,
            absentReason: "",
            entries: []
          };
        });
        save();
      }
      updateAdminUI();
      renderTeachers();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(teachers));
      updateStats();
    }

    function updateAdminUI() {
      const panel = document.getElementById("adminPanel");
      const authContainer = document.getElementById("authButtonContainer");
      const statusText = document.getElementById("adminStatusText");

      if (isAdminLoggedIn) {
        panel.classList.remove("hidden");
        statusText.textContent = "Modus: Administrator (Vollzugriff)";
        statusText.className = "text-[11px] text-orange-300 font-semibold";
        authContainer.innerHTML = `
          <span class="bg-orange-500/20 text-orange-300 border border-orange-400/30 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-shield-halved"></i> Admin Aktiv
          </span>
        `;
      } else {
        panel.classList.add("hidden");
        statusText.textContent = "Modus: Normaler Benutzer (Ansicht)";
        statusText.className = "text-[11px] text-slate-400";
        authContainer.innerHTML = `
          <button onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-700 text-orange-400 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-lock"></i> Admin Login
          </button>
        `;
      }
    }

    function openLoginModal() {
      document.getElementById("loginModal").classList.remove("hidden");
      document.getElementById("loginModal").classList.add("flex");
      document.getElementById("adminPasswordInput").value = "";
      document.getElementById("adminPasswordInput").focus();
    }

    function closeLoginModal() {
      document.getElementById("loginModal").classList.add("hidden");
      document.getElementById("loginModal").classList.remove("flex");
    }

    function verifyAdminLogin() {
      const pw = document.getElementById("adminPasswordInput").value;
      if (pw === ADMIN_PASS) {
        isAdminLoggedIn = true;
        localStorage.setItem("eimlb_is_admin", "true");
        closeLoginModal();
        updateAdminUI();
        renderTeachers();
      } else {
        alert("Falsches Passwort!");
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      localStorage.setItem("eimlb_is_admin", "false");
      updateAdminUI();
      renderTeachers();
    }

    function containsProfanity(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return badWords.some(word => lower.includes(word));
    }

    function addTeacherByAdmin() {
      if (!isAdminLoggedIn) return;
      const nameInput = document.getElementById("newTeacherName");
      const roleInput = document.getElementById("newTeacherRole");
      const name = nameInput.value.trim();
      const role = roleInput.value.trim() || "Fachbereich";

      if (!name) {
        alert("Bitte einen Namen eingeben.");
        return;
      }

      if (containsProfanity(name) || containsProfanity(role)) {
        alert("⚠️ Wortfilter-Warnung: Der Name enthält unerlaubte Ausdrücke!");
        return;
      }

      const parts = name.split(" ");
      const short = parts.length > 1 ? (parts[0][0] + parts[parts.length - 1].slice(0, 2)).toUpperCase() : name.slice(0, 3).toUpperCase();

      teachers.push({
        id: "t-" + Date.now(),
        short,
        name,
        role,
        status: "PRESENT",
        lateMinutes: 0,
        absentReason: "",
        entries: []
      });

      nameInput.value = "";
      roleInput.value = "";
      save();
      renderTeachers();
    }

    function removeTeacher(id) {
      if (!isAdminLoggedIn) return;
      const teacher = teachers.find(t => t.id === id);
      if (!teacher) return;

      if (confirm(`Möchtest du "${teacher.name}" wirklich löschen?`)) {
        teachers = teachers.filter(t => t.id !== id);
        save();
        renderTeachers();
      }
    }

    function updateStats() {
      let present = 0, late = 0, absent = 0, pos = 0, neg = 0;
      teachers.forEach(t => {
        if (t.status === "PRESENT") present++;
        if (t.status === "LATE") late++;
        if (t.status === "ABSENT") absent++;
        t.entries.forEach(e => e.type === "POS" ? pos++ : neg++);
      });
      document.getElementById("statPresent").textContent = present;
      document.getElementById("statLate").textContent = late;
      document.getElementById("statAbsent").textContent = absent;
      document.getElementById("statPos").textContent = `+${pos}`;
      document.getElementById("statNeg").textContent = `-${neg}`;
      document.getElementById("countAll").textContent = teachers.length;
    }

    function setFilter(f) {
      currentFilter = f;
      ["ALL", "LATE", "ABSENT", "ENTRIES"].forEach(k => {
        const btn = document.getElementById(`filter-${k}`);
        btn.className = k === f
          ? "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white"
          : "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200";
      });
      renderTeachers();
    }

    function setStatus(id, status) {
      const t = teachers.find(x => x.id === id);
      if (!t) return;
      t.status = status;
      if (status === "LATE" && !t.lateMinutes) t.lateMinutes = 5;
      save();
      renderTeachers();
    }

    function setLateMin(id, mins) {
      const t = teachers.find(x => x.id === id);
      if (!t) return;
      t.lateMinutes = parseInt(mins, 10) || 0;
      save();
      renderTeachers();
    }

    function setAbsentReason(id, reason) {
      const t = teachers.find(x => x.id === id);
      if (!t) return;
      if (containsProfanity(reason)) {
        alert("⚠️ Wortfilter: Unangemessene Ausdrücke sind nicht erlaubt!");
        return;
      }
      t.absentReason = reason;
      save();
    }

    function toggleEntryPanel(id, type) {
      openPanel[id] = openPanel[id] === type ? null : type;
      renderTeachers();
    }

    function addEntry(id, type, reasonText) {
      const t = teachers.find(x => x.id === id);
      if (!t) return;

      const reason = (reasonText || "").trim() || (type === "POS" ? "Positiver Eintrag" : "Negativer Eintrag");

      if (containsProfanity(reason)) {
        alert("🚫 Wortfilter blockiert: Dieser Eintrag enthält unerlaubte Begriffe!");
        return;
      }

      const now = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      t.entries.unshift({ id: Date.now() + Math.random(), type, reason, time: now });
      openPanel[id] = null;
      save();
      renderTeachers();
    }

    function removeEntry(teacherId, entryId) {
      const t = teachers.find(x => x.id === teacherId);
      if (!t) return;
      t.entries = t.entries.filter(e => e.id !== entryId);
      save();
      renderTeachers();
    }

    function renderTeachers() {
      updateStats();
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const list = document.getElementById("teacherList");

      const filtered = teachers.filter(t => {
        if (currentFilter === "LATE" && t.status !== "LATE") return false;
        if (currentFilter === "ABSENT" && t.status !== "ABSENT") return false;
        if (currentFilter === "ENTRIES" && t.entries.length === 0) return false;
        if (query && !t.name.toLowerCase().includes(query) && !t.role.toLowerCase().includes(query) && !t.short.toLowerCase().includes(query)) return false;
        return true;
      });

      list.innerHTML = filtered.map(t => {
        const posCount = t.entries.filter(e => e.type === "POS").length;
        const negCount = t.entries.filter(e => e.type === "NEG").length;
        const panel = openPanel[t.id];

        return `
          <div class="bg-white rounded-xl border border-slate-200 p-3.5 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-900 text-orange-400 font-bold text-xs flex items-center justify-center shrink-0">
                  ${t.short}
                </div>
                <div>
                  <div class="font-bold text-sm text-slate-900 flex items-center gap-2 flex-wrap">
                    ${t.name}
                    ${posCount > 0 ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold">+${posCount}</span>` : ""}
                    ${negCount > 0 ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-bold">-${negCount}</span>` : ""}
                  </div>
                  <div class="text-xs text-slate-500 font-medium">Fachbereich: <span class="text-slate-700">${t.role}</span></div>
                </div>
              </div>

              <!-- Buttons -->
              <div class="flex items-center gap-1.5 flex-wrap">
                <button onclick="setStatus('${t.id}', 'PRESENT')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition ${
                  t.status === "PRESENT" ? "bg-emerald-600 text-white border-emerald-600" : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-emerald-50"
                }">Anwesend</button>

                <button onclick="setStatus('${t.id}', 'LATE')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition ${
                  t.status === "LATE" ? "bg-amber-500 text-white border-amber-500" : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-amber-50"
                }">Verspätet</button>

                <button onclick="setStatus('${t.id}', 'ABSENT')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition ${
                  t.status === "ABSENT" ? "bg-rose-600 text-white border-rose-600" : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-rose-50"
                }">Abwesend</button>

                <div class="hidden sm:block h-5 w-px bg-slate-200 mx-1"></div>

                <button onclick="toggleEntryPanel('${t.id}', 'POS')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                  panel === "POS" ? "bg-emerald-700 text-white border-emerald-700" : "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100"
                }">+ Positiv</button>

                <button onclick="toggleEntryPanel('${t.id}', 'NEG')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                  panel === "NEG" ? "bg-rose-700 text-white border-rose-700" : "bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100"
                }">- Negativ</button>

                ${isAdminLoggedIn ? `
                  <button onclick="removeTeacher('${t.id}')" title="Lehrer löschen" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2.5 py-1.5 rounded-lg text-xs transition">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                ` : ""}
              </div>
            </div>

            <!-- Verspätungs-Details -->
            ${t.status === "LATE" ? `
              <div class="mt-2.5 pt-2.5 border-t border-amber-100 flex items-center gap-2 flex-wrap text-xs">
                <span class="font-semibold text-amber-800"><i class="fa-regular fa-clock mr-1"></i>Verspätung:</span>
                <button onclick="setLateMin('${t.id}', 5)" class="px-2 py-0.5 rounded border ${t.lateMinutes===5?'bg-amber-500 text-white border-amber-500':'bg-amber-50 text-amber-800 border-amber-200'}">5m</button>
                <button onclick="setLateMin('${t.id}', 10)" class="px-2 py-0.5 rounded border ${t.lateMinutes===10?'bg-amber-500 text-white border-amber-500':'bg-amber-50 text-amber-800 border-amber-200'}">10m</button>
                <button onclick="setLateMin('${t.id}', 15)" class="px-2 py-0.5 rounded border ${t.lateMinutes===15?'bg-amber-500 text-white border-amber-500':'bg-amber-50 text-amber-800 border-amber-200'}">15m</button>
                <input type="number" min="1" max="240" value="${t.lateMinutes}" onchange="setLateMin('${t.id}', this.value)" class="w-14 px-2 py-0.5 border border-amber-300 rounded text-center font-bold text-amber-900" />
                <span class="text-slate-500">Minuten</span>
              </div>
            ` : ""}

            <!-- Abwesenheits-Details -->
            ${t.status === "ABSENT" ? `
              <div class="mt-2.5 pt-2.5 border-t border-rose-100 flex items-center gap-2 flex-wrap text-xs">
                <span class="font-semibold text-rose-700"><i class="fa-solid fa-user-slash mr-1"></i>Grund der Abwesenheit:</span>
                <input type="text" value="${t.absentReason || ''}" onchange="setAbsentReason('${t.id}', this.value)" placeholder="z.B. Krank, Fortbildung..." class="flex-1 px-2.5 py-1 border border-rose-200 rounded-lg focus:outline-none focus:border-rose-500" />
              </div>
            ` : ""}

            <!-- Ausklapp-Menü für +/- Einträge -->
            ${panel ? `
              <div class="mt-3 p-3 rounded-xl ${panel === 'POS' ? 'bg-emerald-50/70 border border-emerald-200' : 'bg-rose-50/70 border border-rose-200'} space-y-2">
                <div class="text-xs font-bold ${panel === 'POS' ? 'text-emerald-800' : 'text-rose-800'}">
                  ${panel === 'POS' ? '+ Positiven Eintrag vergeben:' : '- Negativen Eintrag vergeben:'}
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${(panel === 'POS' ? positiveReasons : negativeReasons).map(r => `
                    <button onclick="addEntry('${t.id}', '${panel}', '${r}')" class="text-xs px-2.5 py-1 rounded-lg bg-white border ${
                      panel === 'POS' ? 'border-emerald-300 text-emerald-800 hover:bg-emerald-600 hover:text-white' : 'border-rose-300 text-rose-800 hover:bg-rose-600 hover:text-white'
                    } font-medium transition">
                      ${panel === 'POS' ? '+' : '-'} ${r}
                    </button>
                  `).join("")}
                </div>
                <div class="flex gap-2 pt-1">
                  <input id="customReason-${t.id}" type="text" placeholder="Oder eigenen Grund eingeben..." class="flex-1 text-xs px-3 py-1.5 bg-white border border-slate-300 rounded-lg focus:outline-none" />
                  <button onclick="addEntry('${t.id}', '${panel}', document.getElementById('customReason-${t.id}').value)" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white ${
                    panel === 'POS' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'
                  }">Speichern</button>
                </div>
              </div>
            ` : ""}

            <!-- Vorhandene Einträge -->
            ${t.entries.length > 0 ? `
              <div class="mt-2.5 pt-2 border-t border-slate-100 flex flex-wrap gap-1.5">
                ${t.entries.map(e => `
                  <span class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full font-medium ${
                    e.type === "POS" ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-rose-50 text-rose-800 border border-rose-200"
                  }">
                    <strong>${e.type === "POS" ? "+" : "-"}</strong> ${e.reason}
                    <span class="text-[10px] opacity-60">(${e.time})</span>
                    <button onclick="removeEntry('${t.id}', ${e.id})" class="hover:text-slate-900 ml-0.5"><i class="fa-solid fa-xmark"></i></button>
                  </span>
                `).join("")}
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    function markAllPresent() {
      teachers.forEach(t => {
        t.status = "PRESENT";
        t.lateMinutes = 0;
      });
      save();
      renderTeachers();
    }

    function resetAllData() {
      if (!isAdminLoggedIn) return;
      if (!confirm("Alle Anwesenheiten und Einträge wirklich zurücksetzen?")) return;
      localStorage.removeItem(STORAGE_KEY);
      init();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
